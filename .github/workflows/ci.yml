name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download modules
        run: go mod download

      - name: Build GUI frontend assets
        run: |
          cd cmd/cerclbackup-gui/frontend
          npm ci
          npm run build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 120s

  integration:
    name: Peer integration test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Multi-buddy P2P integration test
        run: go test -tags integration -v -run TestPeerConnectivity ./cmd/cerclbackup/ -timeout 120s

      - name: Local feature end-to-end smoke test
        run: bash scripts/e2e_test.sh

  build-cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build linux/amd64
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" \
            -o dist/cerclbackup_linux_amd64 ./cmd/cerclbackup

      - name: Build windows/amd64 CLI
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" \
            -o dist/cerclbackup_windows_amd64.exe ./cmd/cerclbackup

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 7

  build-gui-linux:
    name: Build GUI (linux/amd64)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Build GUI
        run: |
          cd cmd/cerclbackup-gui
          wails build -tags webkit2_41

      - name: Upload GUI binary
        uses: actions/upload-artifact@v4
        with:
          name: cerclbackup-gui-linux-amd64
          path: cmd/cerclbackup-gui/build/bin/
          retention-days: 7

  build-gui-windows:
    name: Build GUI (windows/amd64)
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Build GUI
        run: |
          cd cmd/cerclbackup-gui
          wails build

      - name: Upload GUI binary
        uses: actions/upload-artifact@v4
        with:
          name: cerclbackup-gui-windows-amd64
          path: cmd/cerclbackup-gui/build/bin/
          retention-days: 7
